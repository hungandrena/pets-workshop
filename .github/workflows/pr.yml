name: PR
on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # verify.sh runs app/server's unit tests; without these they would fail
      # on import rather than on a real defect.
      - run: pip install -r app/server/requirements.txt
      - run: bash scripts/verify.sh
